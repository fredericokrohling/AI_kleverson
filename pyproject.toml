[project]
name = "assistente-pm"
version = "0.1.0"
description = "Assistente de IA para program e project management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic>=2.3",
    "cryptography>=44",
    "fastapi>=0.115",
    "google-api-python-client>=2.160",
    "google-auth>=2.38",
    "google-auth-oauthlib>=1.2",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

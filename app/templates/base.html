<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kleverson A.I.{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    /* Cores em variáveis: o modo escuro troca só os valores. --marca é o azul-marinho do logo. */
    :root { --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --bg: #fff; --bg2: #f6f8fa; --accent: #0969da;
            --erro: #cf222e; --ok: #1a7f37; --aviso: #9a6700; --marca: #0e1e2e; --marca-fg: #e6edf3; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --bg: #0d1117; --bg2: #151b23; --accent: #4493f8;
              --erro: #f85149; --ok: #3fb950; --aviso: #d29922; }
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; line-height: 1.5; }
    /* Barra do topo com o logo; menu lateral estreito com ícones; conteúdo ao lado. */
    .topo { background: var(--marca); color: var(--marca-fg); display: flex; align-items: center; justify-content: space-between;
            height: 56px; padding: 0 16px 0 0; position: sticky; top: 0; z-index: 2; }
    .topo img { height: 34px; display: block; margin-left: 14px; }
    .topo .quem { font-size: .85rem; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .corpo { display: flex; min-height: calc(100vh - 56px); }
    nav.menu { background: var(--marca); width: 64px; flex: none; display: flex; flex-direction: column; align-items: center;
               padding-top: 8px; gap: 4px; }
    nav.menu a { color: var(--marca-fg); opacity: .7; width: 48px; height: 48px; display: grid; place-items: center;
                 border-radius: 10px; text-decoration: none; }
    nav.menu a:hover { opacity: 1; background: rgba(255,255,255,.08); }
    nav.menu a.ativo { opacity: 1; background: rgba(255,255,255,.16); }
    nav.menu svg { width: 24px; height: 24px; }
    main { flex: 1; min-width: 0; max-width: 1040px; padding: 24px 16px; }
    section { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; scroll-margin-top: 72px; }
    h1 { font-size: 1.3rem; margin: 0 0 16px; } h2 { font-size: 1.05rem; margin-top: 0; }
    .muted { color: var(--muted); } .erro { color: var(--erro); } .ok { color: var(--ok); } .aviso { color: var(--aviso); }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    a, button { color: var(--accent); }
    button, .botao { background: none; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 12px; cursor: pointer;
                     font: inherit; font-size: .9rem; text-decoration: none; display: inline-block; }
    button.perigo { color: var(--erro); border-color: var(--erro); }
    button.mini { padding: 0 6px; font-size: .8rem; border: none; }
    button.mini.secundario { color: var(--muted); }
    input, select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
                    color: var(--fg); max-width: 100%; }
    form.linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    form.inline { display: inline; }
    .aviso-caixa { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; background: var(--bg2); border: 1px solid var(--line); }
    .aviso-caixa.erro { border-color: var(--erro); }
    /* Etiquetas de tag: cheia = própria; tracejada = herdada da pasta de cima. */
    .tag { display: inline-flex; align-items: center; gap: 2px; font-size: .8rem; border: 1px solid var(--accent);
           border-radius: 999px; padding: 0 8px; margin: 2px 2px 2px 0; color: var(--accent); white-space: nowrap; }
    .tag.herdada { border-style: dashed; color: var(--muted); border-color: var(--muted); }
    code { font-size: .85em; background: var(--bg2); padding: 1px 4px; border-radius: 4px; }
    .htmx-indicator { display: none; } .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
  </style>
</head>
<body>
  <header class="topo">
    <a href="/" title="Página inicial"><img src="/static/logo.png" alt="Kleverson A.I."></a>
    <span class="quem">{{ owner }}</span>
  </header>
  <div class="corpo">
    <nav class="menu" aria-label="Menu principal">
      <a href="/" title="Início" aria-label="Início" class="{{ 'ativo' if menu == 'inicio' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
      </a>
      <a href="/config" title="Configurações" aria-label="Configurações" class="{{ 'ativo' if menu == 'config' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <a href="/monitoramento" title="Saúde do sistema" aria-label="Saúde do sistema" class="{{ 'ativo' if menu == 'saude' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </a>
    </nav>
    <main>
      {% if flash %}
        <div class="aviso-caixa {{ 'erro' if flash.erro }}" role="status">{{ flash.texto }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
